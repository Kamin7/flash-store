<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMIN GAMING | آرشیو بازی‌های نوستالژیک</title>
    <base href="/">
    <script>
        if (location.pathname.startsWith('/flash-store/')) document.querySelector('base').href += 'flash-store/'
    </script>
    <link rel="icon" type="image/jpg" sizes="144x144" href="./icon.png">
    <link rel="stylesheet" href="./css/gallery.css?v=1.0">
    <style>
        :root {
            --primary: #ff2a6d; 
            --secondary: #05d9e8; 
            --bg-body: #0a0a0b;
            --bg-card: #16161a;
        }
        body {
            background-color: var(--bg-body) !important;
            color: #ffffff !important;
            font-family: 'Tahoma', sans-serif;
            margin: 0;
            direction: rtl;
        }
        header {
            background: linear-gradient(180deg, #1a1a1d 0%, var(--bg-body) 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary);
            box-shadow: 0 5px 30px rgba(255, 42, 109, 0.3);
        }
        header h1 {
            font-size: 3rem;
            margin: 0;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
        }
        header p {
            font-size: 1.1rem;
            color: var(--secondary);
            margin-top: 10px;
        }
        .search-container {
            padding: 20px 10px;
            text-align: center;
        }
        .input-search {
            width: 90%;
            max-width: 500px;
            padding: 15px;
            border-radius: 50px;
            border: 2px solid #333 !important;
            background: var(--bg-card) !important;
            color: white !important;
            text-align: center;
            outline: none;
        }
        .tags-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        .tag-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            text-decoration: none;
            border: 1px solid #333;
            transition: 0.3s;
        }
        .tag-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .gallery {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)) !important;
            gap: 20px !important;
            padding: 30px !important;
            list-style: none !important;
            max-width: 1200px !important;
            margin: 0 auto !important;
        }
        .gallery li {
            background: var(--bg-card) !important;
            border-radius: 15px !important;
            border: 1px solid #222 !important;
            transition: 0.3s !important;
            overflow: hidden !important;
        }
        .gallery li:hover {
            transform: translateY(-8px) !important;
            border-color: var(--secondary) !important;
        }
        .gallery li img {
            width: 100% !important;
            height: 120px !important;
            object-fit: cover !important;
        }
        .gallery li h2 {
            font-size: 0.8rem !important;
            margin: 0 !important;
            padding: 10px !important;
            text-align: center !important;
            color: #fff !important;
            background: rgba(0,0,0,0.8);
        }
        .sort-by {
            display: flex;
            justify-content: center;
            list-style: none;
            padding: 0;
            gap: 10px;
            margin-bottom: 10px;
        }
        .sort-by a {
            color: #bbb;
            text-decoration: none;
            background: #222;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
        }
        footer {
            text-align: center;
            padding: 40px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid #222;
        }
        .nav-tags, .nav-pagination { display: none !important; }
    </style>
</head>
<body>
    <header>
        <h1>KAMIN GAMING</h1>
        <p>مرکز بازی‌های نوستالژیک</p>
    </header>
    <main>
        <div class="search-container">
            <input type="search" id="search" class="input-search" placeholder="جستجوی بازی مورد نظر..." />
        </div>
        <div class="tags-container">
            <a href="/tag/action" class="tag-btn">اکشن</a>
            <a href="/tag/adventure" class="tag-btn">ماجراجویی</a>
            <a href="/tag/shooting" class="tag-btn">تیراندازی</a>
            <a href="/tag/driving" class="tag-btn">ماشین‌سواری</a>
            <a href="/tag/puzzle" class="tag-btn">فکری</a>
            <a href="/tag/sports" class="tag-btn">ورزشی</a>
        </div>
        <nav>
            <ul class="sort-by">
                <li><a href="./views/">پر بازدیدترین‌ها</a></li>
                <li><a href="./rating/">امتیاز بالا</a></li>
                <li><a href="./newest/">جدیدترین‌ها</a></li>
            </ul>
        </nav>
        <ul class="gallery" id="gallery-container"></ul>
    </main>
    <footer>
        تمامی حقوق برای KAMIN GAMING محفوظ است &copy; 2026
    </footer>
    <script type="module" src="./js/home.js"></script>
</body>
</html>
