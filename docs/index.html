<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMIN GAMING | آرشیو بازی‌های فلش</title>
    <base href="/">
    <script>
        if (location.pathname.startsWith('/flash-store/')) document.querySelector('base').href += 'flash-store/'
    </script>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/jpg" sizes="144x144" href="./icon.png">
    <style>
        :root {
            --primary: #ff2a6d; 
            --secondary: #05d9e8; 
            --bg-body: #0a0a0b;
            --bg-card: #16161a;
            --text: #ffffff;
        }
        body {
            background-color: var(--bg-body);
            color: var(--text);
            font-family: 'Tahoma', sans-serif;
            margin: 0;
            direction: rtl;
        }
        header {
            background: linear-gradient(180deg, #1a1a1d 0%, var(--bg-body) 100%);
            padding: 50px 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary);
            box-shadow: 0 5px 30px rgba(255, 42, 109, 0.3);
        }
        header h1 {
            font-size: 3rem;
            margin: 0;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
        }
        header p {
            font-size: 1.1rem;
            color: var(--secondary);
            margin-top: 10px;
        }
        .search-container {
            padding: 20px;
            text-align: center;
        }
        .input-search {
            width: 90%;
            max-width: 500px;
            padding: 15px;
            border-radius: 50px;
            border: 2px solid #333;
            background: #1a1a1a;
            color: white;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }
        .input-search:focus {
            border-color: var(--primary);
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 30px;
            list-style: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery li {
            background: var(--bg-card);
            border-radius: 15px;
            border: 1px solid #222;
            transition: 0.3s;
        }
        .gallery li:hover {
            transform: scale(1.05);
            border-color: var(--secondary);
        }
        .gallery li a {
            text-decoration: none;
            color: var(--text);
            display: block;
            padding: 20px;
            text-align: center;
        }
        .gallery li h2 {
            font-size: ۰.۹rem;
            margin: 0;
        }
        .sort-by {
            display: flex;
            justify-content: center;
            list-style: none;
            padding: 0;
            gap: 10px;
        }
        .sort-by a {
            color: #bbb;
            text-decoration: none;
            background: #222;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: ۰.۸rem;
        }
        .sort-by a:hover {
            background: var(--secondary);
            color: #000;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: ۰.۸rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>KAMIN GAMING</h1>
        <p> مرکز بازی‌های نوستالژیک </p>
    </header>
    <main>
        <div class="search-container">
            <input type="search" id="search" class="input-search" placeholder="جستجوی بازی..." />
        </div>
        <nav>
            <ul class="sort-by">
                <li><a href="./views/">پر بازدیدترین‌ها</a></li>
                <li><a href="./rating/">امتیاز بالا</a></li>
                <li><a href="./newest/">جدیدترین‌ها</a></li>
            </ul>
        </nav>
        <ul class="gallery">
            </ul>
    </main>
    <footer>
        تمام حقوق برای KAMIN GAMING محفوظ است &copy; ۲۰۲۶
    </footer>
    <script type="module" src="./js/home.js"></script>
</body>
</html>
